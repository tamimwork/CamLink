name: Release (APK + Windows installer)

# Run it by pushing a version tag:   git tag v1.0.0 && git push origin v1.0.0
# or from GitHub: Actions > "Release" > Run workflow
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/CamLink-Android-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: camlink-recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer (.exe)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: camlink-recorder/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List files
        run: ls -la release-files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CamLink ${{ env.TAG }}
          generate_release_notes: true
          files: release-files/*
          body: |
            ## Downloads
            - **Android:** `CamLink-Android-*.apk` (install on your phone, allow "Install unknown apps")
            - **Windows:** `CamLink-Recorder-Setup-*.exe` (installer) or `CamLink-Recorder-Portable-*.exe` (no install)

            Phone and PC must be on the same Wi-Fi. Windows may show a SmartScreen warning because the app is not code-signed: click **More info > Run anyway**.
