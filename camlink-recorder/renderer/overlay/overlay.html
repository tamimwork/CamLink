<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CamLink Floating Controls</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- 48px FLOATING ICON (Collapsed State) -->
  <div class="overlay-pill" id="overlay-pill" title="Click to expand controls, drag to move">
    <div class="pill-pulse-ring" id="pill-pulse-ring"></div>
    <div class="pill-rec-dot" id="pill-rec-dot"></div>
    <span class="pill-timer-text" id="pill-timer-text">00:00</span>
  </div>

  <!-- EXPANDED CONTROL PANEL -->
  <div class="overlay-panel hidden" id="overlay-panel">
    <!-- Panel Header: Grip, Title, Pin & Close -->
    <div class="panel-header" id="panel-drag-bar">
      <div class="drag-grip" title="Drag to reposition">
        <span></span><span></span><span></span>
      </div>
      <div class="header-title-wrap">
        <span class="panel-title">CamLink Remote</span>
        <span class="panel-sub" id="overlay-phone-status">Phone Disconnected</span>
      </div>
      <div class="header-actions">
        <button id="btn-pin" class="btn-tool-icon" title="Pin / Collapse (Esc)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </div>

    <div class="panel-body">
      <!-- Section 1: Recording Controls & Timer -->
      <div class="panel-section">
        <div class="section-label">Recording</div>
        <div class="rec-control-row">
          <div class="panel-timer-badge">
            <span class="timer-dot" id="panel-timer-dot"></span>
            <span id="panel-timer-text">00:00:00</span>
          </div>
          <button id="overlay-btn-rec" class="btn-rec-action" title="Start / Stop Recording">
            <span class="rec-core" id="panel-rec-core"></span>
          </button>
          <button id="overlay-btn-pause" class="btn-rec-action btn-pause" disabled title="Pause / Resume">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>
        </div>
      </div>

      <!-- Section 2: Camera Controls (Flip, Mic, Video, Mirror, Torch) -->
      <div class="panel-section">
        <div class="section-label">Camera & Audio</div>
        <div class="btn-icon-grid">
          <button id="overlay-btn-camera" class="btn-panel-toggle" title="Flip Camera (Front/Rear)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 16v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4"></path><path d="M4 8V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <span>Flip</span>
          </button>

          <button id="overlay-btn-mic" class="btn-panel-toggle" title="Phone Microphone Active / Muted">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
            <span>Mic</span>
          </button>

          <button id="overlay-btn-video" class="btn-panel-toggle" title="Video Stream Active / Paused">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
            <span>Video</span>
          </button>

          <button id="overlay-btn-mirror" class="btn-panel-toggle" title="Mirror Feed">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            <span>Mirror</span>
          </button>

          <button id="overlay-btn-torch" class="btn-panel-toggle" title="Toggle Torch / Flashlight">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span>Torch</span>
          </button>
        </div>
      </div>

      <!-- Section 3: AF / AE Lock Pills -->
      <div class="panel-section">
        <div class="section-label">Autofocus & Exposure</div>
        <div class="pills-row">
          <button id="overlay-btn-af" class="btn-pill-toggle active" title="Toggle Autofocus Lock">
            <span class="pill-dot"></span>
            <span id="overlay-af-text">AF Auto</span>
          </button>
          <button id="overlay-btn-ae" class="btn-pill-toggle active" title="Toggle Auto-Exposure Lock">
            <span class="pill-dot"></span>
            <span id="overlay-ae-text">AE Auto</span>
          </button>
        </div>
      </div>

      <!-- Section 4: Zoom Slider & Presets -->
      <div class="panel-section">
        <div class="section-label-flex">
          <span>Digital Zoom</span>
          <span class="zoom-readout" id="overlay-zoom-readout">1.0x</span>
        </div>
        <input type="range" id="overlay-zoom-slider" min="1.0" max="5.0" step="0.1" value="1.0" class="overlay-slider">
        <div class="pills-row compact" style="margin-top: 5px;">
          <button class="btn-zoom-preset active" data-zoom="1.0">1.0x</button>
          <button class="btn-zoom-preset" data-zoom="2.0">2.0x</button>
          <button class="btn-zoom-preset" data-zoom="3.0">3.0x</button>
        </div>
      </div>

      <!-- Section 5: Stream Quality -->
      <div class="panel-section">
        <div class="section-label">Stream Profile</div>
        <div class="pills-row compact">
          <button class="btn-quality-preset active" data-quality="1080p@30">1080p 30</button>
          <button class="btn-quality-preset" data-quality="1080p@60">1080p 60</button>
          <button class="btn-quality-preset" data-quality="720p@30">720p 30</button>
        </div>
      </div>

      <!-- Section 6: Face Bubble Shape & Main Window Dock -->
      <div class="panel-section">
        <div class="section-label">Face Bubble & App</div>
        <div class="bottom-actions-row">
          <div class="shape-buttons">
            <button class="btn-shape-icon" data-shape="circle" title="Circle Shape">
              <span class="shape-dot circle"></span>
            </button>
            <button class="btn-shape-icon" data-shape="rounded" title="Rounded Shape">
              <span class="shape-dot rounded"></span>
            </button>
            <button class="btn-shape-icon" data-shape="rect" title="Rectangle Shape">
              <span class="shape-dot rect"></span>
            </button>
          </div>
          <button id="overlay-btn-focus-main" class="btn-dock-main" title="Focus Main Window">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            <span>Main App</span>
          </button>
        </div>
      </div>

      <!-- Section 7: Telemetry & Status Footer -->
      <div class="panel-footer">
        <div class="telemetry-item" id="overlay-battery-item">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect><line x1="22" y1="11" x2="22" y2="13"></line></svg>
          <span id="overlay-battery-text">--%</span>
        </div>
        <div class="telemetry-item" id="overlay-latency-item">
          <span id="overlay-latency-text">-- ms</span>
        </div>
        <button id="overlay-btn-disconnect" class="btn-link-danger" title="End Session">End Session</button>
      </div>

    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
